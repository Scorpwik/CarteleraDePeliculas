<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Mi Cartelera</title>
  <!-- Fondo sala -->
  <rect width="64" height="64" rx="14" fill="#0E0D0C"/>
  <!-- Cartel / ticket -->
  <rect x="12" y="10" width="40" height="44" rx="4" fill="#EFE9DC" stroke="#121010" stroke-width="2"/>
  <!-- Perforaciones de ticket -->
  <circle cx="12" cy="22" r="3" fill="#0E0D0C"/>
  <circle cx="12" cy="32" r="3" fill="#0E0D0C"/>
  <circle cx="12" cy="42" r="3" fill="#0E0D0C"/>
  <circle cx="52" cy="22" r="3" fill="#0E0D0C"/>
  <circle cx="52" cy="32" r="3" fill="#0E0D0C"/>
  <circle cx="52" cy="42" r="3" fill="#0E0D0C"/>
  <!-- Franja acento -->
  <rect x="18" y="16" width="28" height="8" fill="#FF4B1F"/>
  <!-- Estrella mantequilla -->
  <path
    fill="#F4D35E"
    stroke="#121010"
    stroke-width="1.2"
    d="M32 28.5l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z"
  />
  <!-- Líneas tipográficas del cartel -->
  <rect x="20" y="46" width="24" height="2.5" rx="1" fill="#121010"/>
  <rect x="24" y="50.5" width="16" height="2" rx="1" fill="#121010" opacity="0.45"/>
</svg>
